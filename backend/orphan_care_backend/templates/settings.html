{% extends 'base.html' %}

{% block content %}
<section class="page-shell">
    <div class="panel">
        <h3 class="panel-title">
            إعدادات المنظومة
            <span class="panel-kicker"><i class="fas fa-gear"></i></span>
        </h3>

        <form class="form-grid">
            <div>
                <label for="organizationName">اسم المؤسسة</label>
                <input id="organizationName" type="text" value="جمعية رعاية الأيتام">
            </div>
            <div>
                <label for="systemLanguage">لغة النظام</label>
                <select id="systemLanguage">
                    <option>العربية</option>
                    <option>English</option>
                </select>
            </div>
            <button type="button"><i class="fas fa-floppy-disk"></i> حفظ الإعدادات</button>
        </form>
    </div>

    <div class="content-card settings-note">
        <div class="list-item">
            <span class="list-icon"><i class="fas fa-circle-info"></i></span>
            <div>
                <strong>إعدادات عامة</strong>
                <span>هذه الصفحة تستخدم نفس تنسيق لوحة كنف الموحد دون تغيير منطق النظام الحالي.</span>
            </div>
        </div>
    </div>
</section>
{% endblock %}
