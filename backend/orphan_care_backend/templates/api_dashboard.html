{% extends 'base.html' %}

{% block content %}
<section class="page-shell">
    <div class="panel">
        <h3 class="panel-title">
            مركز توليد البيانات API
            <span class="panel-kicker"><i class="fas fa-plug-circle-check"></i> متصل</span>
        </h3>
        <p class="section-note">عرض سريع للبيانات التي تستهلكها واجهات التطبيق من نقاط الـAPI الحالية.</p>
    </div>

    <div class="code-grid">
        <div class="code-panel">
            <div class="code-header">
                <h3><i class="fas fa-children"></i> بيانات الأيتام JSON</h3>
                <code>GET /api/orphans/</code>
            </div>
            <pre>{{ orphans_json }}</pre>
        </div>

        <div class="code-panel">
            <div class="code-header">
                <h3><i class="fas fa-gift"></i> بيانات التبرعات JSON</h3>
                <code>GET /api/donations/</code>
            </div>
            <pre>{{ donations_json }}</pre>
        </div>
    </div>
</section>
{% endblock %}
