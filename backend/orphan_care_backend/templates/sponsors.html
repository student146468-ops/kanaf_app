{% extends 'base.html' %}

{% block content %}
<section class="page-shell">
    <div class="panel">
        <h3 class="panel-title">
            إضافة كفيل جديد
            <span class="panel-kicker"><i class="fas fa-user-group"></i></span>
        </h3>
        <form method="POST" class="form-grid">
            {% csrf_token %}
            <div>
                <label for="sponsorName">اسم الكفيل</label>
                <input id="sponsorName" type="text" name="s_name" required placeholder="الاسم الكامل">
            </div>
            <div>
                <label for="sponsorPhone">رقم الهاتف</label>
                <input id="sponsorPhone" type="text" name="s_phone" required placeholder="09XXXXXXXX">
            </div>
            <button type="submit"><i class="fas fa-floppy-disk"></i> حفظ الكفيل</button>
        </form>
    </div>

    <div class="panel content-card">
        <h3 class="panel-title">
            قائمة الكفلاء المسجلين
            <span class="panel-kicker">{{ sponsors|length }}</span>
        </h3>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>اسم الكفيل</th>
                        <th>رقم الهاتف</th>
                        <th class="text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in sponsors %}
                    <tr>
                        <td class="name-cell">{{ s.name }}</td>
                        <td>{{ s.phone }}</td>
                        <td class="text-center">
                            <form method="POST" action="{% url 'delete_sponsor' s.id %}" class="delete-form inline-form" data-delete-name="{{ s.name }}">
                                {% csrf_token %}
                                <input type="hidden" name="confirm_delete" value="">
                                <button type="submit" class="delete-button"><i class="fas fa-trash"></i> حذف</button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="empty-state">لا يوجد كفلاء مسجلون حاليًا.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
