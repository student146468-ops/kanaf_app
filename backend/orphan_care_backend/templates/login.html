{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    {% get_static_prefix as STATIC_PREFIX %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كنف | تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ STATIC_PREFIX }}management/css/typography.css?v=4">
    <style>
        :root {
            --orange-800: #b94000;
            --orange-700: #df5200;
            --orange-600: #f46500;
            --orange-500: #ff7a00;
            --cream: #fff4e8;
            --text: #321a0d;
            --muted: #7e6252;
            --line: rgba(255, 255, 255, 0.58);
            --glass: rgba(255, 248, 242, 0.74);
            --shadow: 0 22px 54px rgba(126, 50, 0, 0.22);
            --inner: inset 0 1px 0 rgba(255, 255, 255, 0.84), inset 0 -1px 0 rgba(156, 65, 0, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            direction: rtl;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(143, 47, 0, 0.30), rgba(255, 122, 0, 0.12) 34%, rgba(255, 244, 232, 0.72)),
                linear-gradient(225deg, rgba(255, 179, 107, 0.46), rgba(255, 255, 255, 0.34) 48%, rgba(223, 82, 0, 0.18)),
                #fff0df;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(115deg, rgba(255, 255, 255, 0.36), transparent 34%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.12) 0 1px, transparent 1px 90px);
            opacity: 0.72;
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: min(440px, 100%);
            display: grid;
            gap: 18px;
        }

        .brand {
            display: grid;
            place-items: center;
            text-align: center;
            gap: 8px;
        }

        .brand-mark {
            width: 84px;
            height: 84px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: linear-gradient(145deg, #ffad61, var(--orange-500));
            box-shadow: 0 10px 0 #bd4100, 0 20px 34px rgba(175, 58, 0, 0.24), inset 0 2px 0 rgba(255,255,255,0.62);
        }

        .brand-mark img {
            width: 68%;
            height: 68%;
            display: block;
            object-fit: contain;
            border-radius: 24px;
        }

        h1 {
            margin: 0;
            color: var(--orange-600);
            font-size: 2.5rem;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.75), 0 10px 20px rgba(175, 58, 0, 0.16);
        }

        .login-card {
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--glass);
            box-shadow: var(--shadow), var(--inner);
            backdrop-filter: blur(24px) saturate(1.18);
        }

        .login-card h2 {
            margin: 0 0 6px;
            color: #3a1c0a;
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: 0;
        }

        .login-card p {
            margin: 0 0 18px;
            color: var(--muted);
            font-weight: 800;
        }

        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            color: #5f402d;
            font-size: 0.95rem;
            font-weight: 900;
        }

        .input-wrap {
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.62);
            border-radius: 16px;
            background: rgba(255, 250, 246, 0.72);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.64);
        }

        .input-wrap i {
            color: var(--orange-700);
        }

        input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            color: var(--text);
            background: transparent;
            font: inherit;
            font-weight: 800;
        }

        button {
            width: 100%;
            min-height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            border-radius: 15px;
            padding: 12px 18px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 900;
            background: linear-gradient(145deg, #ff9e3d, var(--orange-600));
            box-shadow: 0 6px 0 #bd4100, 0 13px 22px rgba(175, 58, 0, 0.24), inset 0 1px 0 rgba(255,255,255,0.70);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #bd4100, 0 8px 16px rgba(175, 58, 0, 0.20), inset 0 1px 0 rgba(255,255,255,0.55);
        }

        .messages {
            display: grid;
            gap: 8px;
            margin-bottom: 14px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 14px;
            color: #7a1f00;
            background: rgba(255, 231, 213, 0.88);
            border: 1px solid rgba(255, 122, 0, 0.20);
            font-weight: 800;
        }

        .admin-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--orange-800);
            text-decoration: none;
            font-weight: 900;
        }

        .admin-link:hover {
            color: var(--orange-600);
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <header class="brand">
            <div class="brand-mark">
                <img src="{% static 'management/images/kanaf-care-logo.svg' %}" alt="Kanaf">
            </div>
            <h1>كنف</h1>
        </header>

        <section class="login-card">
            <h2>تسجيل الدخول</h2>
            <p>منظومة إدارة رعاية الأيتام</p>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="field">
                    <label for="id_username">اسم المستخدم</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="field">
                    <label for="id_password">كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-key"></i>
                        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit">
                    <span>دخول</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
            </form>
        </section>

        <a class="admin-link" href="/django-admin/">
            <span>إدارة دجانغو الأصلية</span>
            <i class="fas fa-screwdriver-wrench"></i>
        </a>
    </main>
</body>
</html>
