{% extends 'base.html' %}

{% block content %}
<section class="page-shell">
    <div class="panel">
        <h3 class="panel-title">
            إضافة صنف للمخزن
            <span class="panel-kicker"><i class="fas fa-box-open"></i></span>
        </h3>
        <form method="POST" class="form-grid">
            {% csrf_token %}
            <div>
                <label for="inventoryName">اسم الصنف</label>
                <input id="inventoryName" type="text" name="i_name" required placeholder="مثال: كراسي، حليب، قرطاسية">
            </div>
            <div>
                <label for="inventoryQuantity">الكمية المتوفرة</label>
                <input id="inventoryQuantity" type="number" name="i_qty" required placeholder="0">
            </div>
            <button type="submit"><i class="fas fa-floppy-disk"></i> تحديث المخزن</button>
        </form>
    </div>

    <div class="panel content-card">
        <h3 class="panel-title">
            جرد الأصناف المتاحة
            <span class="panel-kicker">{{ items|length }}</span>
        </h3>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>اسم الصنف</th>
                        <th>الكمية</th>
                        <th class="text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr>
                        <td class="name-cell">{{ item.item_name }}</td>
                        <td><span class="badge">{{ item.quantity }}</span></td>
                        <td class="text-center">
                            <form method="POST" action="{% url 'delete_inventory' item.id %}" class="delete-form inline-form" data-delete-name="{{ item.item_name }}">
                                {% csrf_token %}
                                <input type="hidden" name="confirm_delete" value="">
                                <button type="submit" class="delete-button"><i class="fas fa-trash"></i> حذف</button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="empty-state">المخزن فارغ حاليًا.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
