plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def kanafAbiByPlatform = [
    "android-arm": "armeabi-v7a",
    "android-arm64": "arm64-v8a",
    "android-x64": "x86_64",
]
def kanafTargetAbis = (project.findProperty("target-platform") ?: "android-arm,android-arm64,android-x64")
    .toString().split(",").collect { platform ->
        def abi = kanafAbiByPlatform[platform.trim()]
        if (abi == null) {
            throw new GradleException("Unsupported Android target platform: $platform")
        }
        abi
    }
def kanafSplitPerAbi = project.findProperty("split-per-abi")?.toString()?.toBoolean() ?: false

android {
    namespace = "com.example.orphan_care_app"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.kanaf.orphan_care_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = 2
        versionName = flutter.versionName
    }

    buildTypes {
        configureEach { buildType ->
            // Flutter's default filters include all ABIs. Match native plugin
            // libraries to the selected engine so a phone APK stays ARM64-only.
            // ABI splits configure their own filters and must remain separate.
            if (!kanafSplitPerAbi) {
                buildType.ndk.abiFilters.clear()
                buildType.ndk.abiFilters.addAll(kanafTargetAbis)
            }
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
